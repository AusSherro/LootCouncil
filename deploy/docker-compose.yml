services:
  loot-council:
    build:
      context: ./loot-council
      dockerfile: Dockerfile
    container_name: loot-council
    restart: unless-stopped
    # Deliberately NOT published to the host — Caddy is the only entry point.
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      TZ: Australia/Sydney
      DATABASE_URL: file:/app/data/loot-council.db
      # Optional: set OPENAI_API_KEY in a sibling .env file to enable AI features.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - loot-council-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/settings').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      loot-council:
        condition: service_healthy
    networks:
      - web

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    environment:
      TZ: Australia/Sydney
      FTLCONF_webserver_port: "80"
    volumes:
      - pihole-config:/etc/pihole
      - pihole-dnsmasq:/etc/dnsmasq.d
    networks:
      - web

volumes:
  caddy-data:
  loot-council-data:
  pihole-config:
  pihole-dnsmasq:

networks:
  web:
    driver: bridge
